name: Trendplus Keep-Alive

# Sole purpose: hit the Render backend often enough that it never spins down,
# so the first real visitor doesn't wait ~50s for a cold start.
# It does no work of its own — one GET, one status line, done.

on:
  schedule:
    # Every 10 minutes (UTC). Render free instances sleep after ~15 minutes of
    # no inbound traffic, and GitHub's scheduler is often several minutes late,
    # so 10 leaves headroom. Change to '*/15 * * * *' if you prefer.
    - cron: '*/10 * * * *'
  workflow_dispatch:        # manual "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency:
  group: trendplus-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Trendplus backend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping endpoint
        env:
          # Required secret. Must point at the RENDER service, e.g.
          #   https://trendplus-lvkt.onrender.com/health
          TRENDPLUS_CRON_URL: ${{ secrets.TRENDPLUS_CRON_URL }}
          # Optional secret — only sent if you create it.
          TRENDPLUS_AUTH_TOKEN: ${{ secrets.TRENDPLUS_AUTH_TOKEN }}
          # Optional repository variables, defaults are fine for a keep-alive ping.
          AUTH_HEADER_NAME: ${{ vars.TRENDPLUS_AUTH_HEADER_NAME || 'X-Admin-Secret' }}
          HTTP_METHOD: ${{ vars.TRENDPLUS_HTTP_METHOD || 'GET' }}
          MAX_TIME: ${{ vars.TRENDPLUS_MAX_TIME || '150' }}
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "${TRENDPLUS_CRON_URL}" ]; then
            echo "::error::Secret TRENDPLUS_CRON_URL is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          BODY_FILE="$(mktemp)"   # response body is saved here and never printed in full
          ERR_FILE="$(mktemp)"

          ARGS=(
            --silent --show-error
            --request "${HTTP_METHOD}"
            --connect-timeout 20
            --max-time "${MAX_TIME}"
            --retry 3 --retry-delay 10 --retry-connrefused
            --location --max-redirs 3
            --header 'Accept: application/json'
            --header 'User-Agent: trendplus-github-actions-keepalive/1.0'
            --output "${BODY_FILE}"
            --write-out '%{http_code} %{time_total}'
          )
          [ -n "${TRENDPLUS_AUTH_TOKEN}" ] && ARGS+=(--header "${AUTH_HEADER_NAME}: ${TRENDPLUS_AUTH_TOKEN}")

          META="$(curl "${ARGS[@]}" "${TRENDPLUS_CRON_URL}" 2>"${ERR_FILE}")"
          CURL_EXIT=$?

          # connection / timeout / DNS / TLS failures
          if [ "${CURL_EXIT}" -ne 0 ]; then
            case "${CURL_EXIT}" in
              6)     REASON="DNS resolution failed (bad host in TRENDPLUS_CRON_URL)" ;;
              7)     REASON="connection refused / host unreachable" ;;
              28)    REASON="timed out after ${MAX_TIME}s (cold start took too long?)" ;;
              35|60) REASON="TLS/SSL error" ;;
              52)    REASON="empty reply from server" ;;
              56)    REASON="connection broken while receiving" ;;
              *)     REASON="request failed" ;;
            esac
            echo "::error::Ping failed: ${REASON} (curl exit ${CURL_EXIT})"
            head -c 300 "${ERR_FILE}"; echo
            exit 1
          fi

          HTTP_STATUS="${META%% *}"
          ELAPSED="${META##* }"

          # non-2xx
          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "::error::Backend returned HTTP status: ${HTTP_STATUS}"
            echo "First 300 bytes of the response (debug only):"
            head -c 300 "${BODY_FILE}"; echo
            exit 1
          fi

          echo "Backend pinged successfully"
          echo "HTTP status: ${HTTP_STATUS}"
          echo "Elapsed: ${ELAPSED}s | response size: $(wc -c < "${BODY_FILE}") bytes (body not logged)"

          # An elapsed time above ~10s means the instance had gone to sleep.
          awk -v t="${ELAPSED}" 'BEGIN { if (t+0 > 10) print "::warning::Slow response (" t "s) - the instance had likely spun down. Consider a shorter cron interval." }'

          {
            echo "### Trendplus keep-alive ping"
            echo ""
            echo "- HTTP status: \`${HTTP_STATUS}\`"
            echo "- Elapsed: \`${ELAPSED}s\`"
          } >> "${GITHUB_STEP_SUMMARY}"
